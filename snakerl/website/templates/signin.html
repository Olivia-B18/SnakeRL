 {% extends "base.html" %}
{% block title %}
    Sign In
{% endblock %}
{% block container %}
    <h1 class="text-center title">Sign In</h1>
    <div class="mx-auto mt-5" style="width: 400px;">
        <form method="post">
            <div class="form-group">
                <input type="text"
                       class="form-control"
                       name="first-name"
                       id="first-name"
                       placeholder="enter first name">
            </div>
            <br>
            <div class="form-group">
                <input type="text"
                       class="form-control"
                       name="last-name"
                       id="last-name"
                       placeholder="enter last initial">
            </div>
            <br>
            <div class="form-group">
                <select style="width: 400px;
                               height: 38px"
                        name="xp-level"
                        id="xp-level">
                    <option value="-1">experience level</option>
                    <option value="Zero">Zero experience with RL</option>
                    <option value="Some">Some experience with RL</option>
                    <option value="Comfortable">Comfortable with RL</option>
                    <option value="Experienced">Experienced with RL</option>
                </select>
            </div>
            <br>
            <div class="text-center">
                <button type="submit" style="width: 200px;" class="btn button">let's go</button>
            </div>
        </form>
    </div>
{% endblock %}
