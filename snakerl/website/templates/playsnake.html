{% extends "base.html" %}
{% block title %}
    PlaySnake
{% endblock %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='snake.css') }}" />
{% endblock %}
{% block container %}
    <h1 class="text-center title">Play Snake</h1>
    <br>
    <!-- Game canvas -->
    <div class="game-container">
        <canvas class="game-board" id="gameBoard" width="640" height="480"></canvas>
    </div>
    <br>
    <!-- Statistics -->
    <h3 class="text-center" id="scoreText" style="margin-bottom: 0rem;">SCORE: 0</h3>
    <h3 class="text-center" id="gameText" style="margin-bottom: 0rem;">GAMES: 0</h3>
    <br>
    <!-- Buttons -->
    <div class="mx-auto mt-1" style="width: 200px;">
        <button id="resetBtn" style="width: 200px;" class="btn button">play</button>
    </div>
    <div class="col mt-5">
        <div class="text-center">
            <a href="/howtosnake" style="width: 200px;" class="btn button-outline mx-3">
                <i class="fa fa-arrow-left" aria-hidden="true"></i> back
            </a>
            <a href="/untrained" style="width: 200px;" class="btn button-outline">
                continue <i class="fa fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>
    </div>
    <script src="{{url_for('static', filename='snakecanvas.js')}}"></script>
    <script src="{{url_for('static', filename='playsnake.js')}}"></script>
{% endblock %}
